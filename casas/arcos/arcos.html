<meta charset="utf-8">
<title>Arcos 4264</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: lámina de obra. Plano a la izquierda (SVG navegable), panel técnico a la derecha con pestañas; en teléfono se apilan.
   Misma familia visual que el visor de la escalera, para que los dos se lean como el mismo proyecto. */
:root{
  --bg:#eceeea; --panel:#f8f9f6; --stage:#e4e7e2; --ink:#1d2321; --muted:#5c6662; --rule:#c7cdc8; --soft:#dfe3dd;
  --accent:#b4471f; --accent-soft:#f3dccf;          /* selección */
  --dim:#1f5f8b; --dim-bg:#e3eef6;                   /* cotas, vidrio, medición */
  --nuevo:#2f6b4f; --nuevo-soft:#d9e8df;             /* construido nuevo */
  --proy:#c27a14; --proy-soft:#f6e6c8;               /* proyecto, no construido */
  --demo:#8a8f8c;                                    /* provisorio / a demoler */
  --wall:#2a302e; --wall-light:#6a716e; --room:#f4f5f1; --deck:#d8c6a8; --roof:#cfd4cc; --green:#b9cbb0;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141817; --panel:#1b201f; --stage:#1f2524; --ink:#e4e8e6; --muted:#98a39e; --rule:#33403c; --soft:#2a3330;
  --accent:#e8794c; --accent-soft:#3a2419; --dim:#7fbbe6; --dim-bg:#16283a; --nuevo:#7fc9a3; --nuevo-soft:#1d3328; --proy:#e2a84a; --proy-soft:#3a2d14; --demo:#7d8582;
  --wall:#d8ddd9; --wall-light:#8d9692; --room:#262d2b; --deck:#4a3f2f; --roof:#2d3432; --green:#2b3d2f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141817; --panel:#1b201f; --stage:#1f2524; --ink:#e4e8e6; --muted:#98a39e; --rule:#33403c; --soft:#2a3330;
  --accent:#e8794c; --accent-soft:#3a2419; --dim:#7fbbe6; --dim-bg:#16283a; --nuevo:#7fc9a3; --nuevo-soft:#1d3328; --proy:#e2a84a; --proy-soft:#3a2d14; --demo:#7d8582;
  --wall:#d8ddd9; --wall-light:#8d9692; --room:#262d2b; --deck:#4a3f2f; --roof:#2d3432; --green:#2b3d2f; color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0}
.spec{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.spec b{color:var(--ink);font-weight:500}
main[hidden]{display:none}
.zona .zonarect{fill:var(--nuevo);fill-opacity:.05;stroke:var(--nuevo);stroke-width:1;stroke-dasharray:6 4;vector-effect:non-scaling-stroke}
.zona .zonaline{stroke:var(--nuevo);stroke-opacity:.45;stroke-width:1;vector-effect:non-scaling-stroke}
.mueble{fill:var(--soft);stroke:var(--muted);stroke-width:1;vector-effect:non-scaling-stroke}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;height:calc(100% - 62px);min-height:560px}
#modo-3d{grid-template-columns:minmax(0,1fr) 6px var(--aside-w,215px);grid-template-rows:minmax(0,1fr) auto;gap:0 0;min-height:0;height:calc(100% - 40px)}
#modo-3d .stage{grid-column:1;grid-row:1;min-height:0;border-radius:4px 0 0 0}
#modo-3d .bottombar{grid-column:1;grid-row:2;position:static;margin:0;border-radius:0 0 0 4px;border-top:0;padding:3px 8px;font-size:11px;gap:2px 9px;min-height:0}
#modo-3d .bottombar input[type=range]{width:80px;height:12px}
#modo-3d .bottombar select{font-size:11px;padding:1px 2px;max-width:120px}
#modo-3d .bottombar{flex-wrap:nowrap;overflow-x:auto;white-space:nowrap}
#modo-3d .bottombar .hint{margin-left:auto}
#modo-3d .bottombar .btn.mini{padding:0 4px;font-size:10px;line-height:16px}
#modo-3d .gutter{grid-column:2;grid-row:1/3;cursor:col-resize;background:var(--rule);opacity:.6}
#modo-3d .gutter:hover,#modo-3d .gutter.on{opacity:1;background:var(--accent)}
#modo-3d aside{grid-column:3;grid-row:1/3;border-radius:0 4px 4px 0;border-left:0}
#modo-3d.noaside{grid-template-columns:minmax(0,1fr) 0 0}
#modo-3d.noaside aside,#modo-3d.noaside .gutter{display:none}
#modo-3d.noaside .stage{border-radius:4px 4px 0 0}#modo-3d.noaside .bottombar{border-radius:0 0 4px 4px}
#topright{position:absolute;top:8px;right:8px;z-index:5;display:flex;gap:6px;align-items:center}
#asideTg{width:24px;height:24px;padding:0;font-size:13px;line-height:22px;text-align:center;opacity:.85}
#vistasSel{display:none!important}
#vistasPop{position:absolute;top:34px;right:0;z-index:8;min-width:210px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.2);font-size:12px}
#vistasPop .vpg{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:5px 6px 1px}
#vistasPop .vpi{display:flex;align-items:center}#vistasPop .vpb{flex:1;text-align:left;background:none;border:0;padding:1px 6px;line-height:1.25;border-radius:3px;cursor:pointer;color:var(--ink);font:inherit}#vistasPop .vpb:hover{background:var(--soft)}
#vistasPop .vpx{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0 6px;line-height:1}#vistasPop .vpx:hover{color:var(--accent)}#vistasPop .vpe{color:var(--muted);padding:2px 6px 6px}

#vistaForm{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--accent);border-radius:3px;padding:2px 4px;font-size:12px}
#vistaForm[hidden]{display:none}
#vistaForm input{width:150px;font-size:12px;padding:2px 4px}
#viewbar{display:none!important}
#fps{position:absolute;right:6px;bottom:4px;z-index:5;font-family:var(--f-mono);font-size:9px;color:var(--muted);background:transparent;padding:0 3px;pointer-events:none;opacity:.6}#fps.lento{color:var(--accent);border-color:var(--accent)}
#toolbar3d{position:absolute;left:8px;top:8px;z-index:7;display:flex;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
#toolbar3d .tb{width:32px;height:32px;border:1px solid transparent;border-radius:4px;background:transparent;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
#toolbar3d .tb:hover{background:var(--soft)}#toolbar3d .tb[aria-pressed=true]{background:var(--accent);color:#fff}
#toolbar3d .tbsep{height:1px;background:var(--rule);margin:2px 3px}
#editarTg,#senalarTg,#marcarTg,#medirTg{display:none!important}
#medPanel{position:absolute;left:54px;top:8px;z-index:6;width:300px;max-height:calc(100% - 60px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#medPanel .mh{display:flex;justify-content:space-between}#medPanel .mx{cursor:pointer;font-size:16px}#medPanel .s{color:var(--muted);font-size:11px}#medPanel .mrow{display:flex;gap:5px;align-items:center;margin:5px 0}#medPanel .edref{margin:6px 0;padding:4px 6px;background:var(--soft);border-radius:3px}#medPanel .edref:empty{display:none}#medPanel .mitem{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-top:1px solid var(--rule)}#medPanel .mitem .s{flex:1}
.medlbl{position:absolute;z-index:4;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:11px;font-weight:600;color:#fff;background:#1f5f8b;border-radius:3px;padding:1px 5px;pointer-events:none;white-space:nowrap}
#edPanel,#senPanel,#marcasPanel,#medPanel{left:54px!important;top:44px!important}
#senPanel{position:absolute;top:44px;left:8px;z-index:6;width:300px;max-height:calc(100% - 60px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#senPanel .mh{display:flex;justify-content:space-between}#senPanel .mx{cursor:pointer;font-size:16px}#senPanel .s{color:var(--muted);font-size:11px}#senPanel .mrow{display:flex;gap:5px;align-items:center;margin:5px 0}
#senPanel .edref{margin:6px 0;padding:4px 6px;background:var(--soft);border-radius:3px;min-height:1em}#senPanel .edref:empty{display:none}#senPanel .mitem{display:flex;align-items:baseline;gap:6px;padding:3px 0;border-top:1px solid var(--rule)}#senPanel .mitem .s{flex:1}
#senalarTg[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#edPanel{position:absolute;top:44px;left:8px;z-index:6;width:290px;max-height:calc(100% - 60px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#edPanel .mh{display:flex;justify-content:space-between}#edPanel .mx{cursor:pointer;font-size:16px}#edPanel .mh2{margin-top:8px;font-weight:600;border-top:1px solid var(--rule);padding-top:5px}
#edPanel .mrow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:5px 0}#edPanel .seg .btn[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
#edPanel .mhint,#edPanel .mmsg,#edPanel .s{color:var(--muted);font-size:11px}#edPanel .edref{margin:6px 0;padding:4px 6px;background:var(--soft);border-radius:3px;font-size:12px;min-height:1em}#edPanel .edref:empty{display:none}
#edPanel .ednum{display:flex;flex-direction:column;font-size:10.5px;color:var(--muted)}
#edPanel .ednum input{width:62px;font-size:12px;padding:2px 3px}#edPanel .edsel{margin:6px 0 2px}
#edPanel .mitem{display:flex;align-items:center;gap:5px;padding:3px 0;border-top:1px solid var(--rule)}#edPanel .mitem .s{flex:1}
#editarTg[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage.editando canvas{cursor:move}
.edtip{position:absolute;z-index:7;background:rgba(20,20,20,.8);color:#fff;font-family:var(--f-mono);font-size:12px;padding:2px 6px;border-radius:3px;pointer-events:none}
#marcarTg[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.stage.marcando canvas{cursor:crosshair}
#marcasPanel{position:absolute;top:44px;right:8px;z-index:6;width:270px;max-height:calc(100% - 60px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#marcasPanel .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#marcasPanel .mx{cursor:pointer;font-size:16px;line-height:1;padding:0 4px}

#marcasPanel .mrow input[type=text]{flex:1;min-width:0;font-size:12px;padding:3px 5px}

#marcasPanel .mitem{display:flex;align-items:center;gap:5px;padding:3px 0;border-top:1px solid var(--rule)}
#marcasPanel .mitem .s{flex:1;min-width:0;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#marcasPanel .sw{width:9px;height:9px;border-radius:50%;flex:none}
#marcasPanel .mmsg{color:var(--muted);font-size:11px;margin-top:4px}
body.m3d header{display:none}
body.m3d{padding:6px}
#modo-3d{height:100%}

(function(){const btns=document.querySelectorAll('.mode');window.__setModo=m=>set(m);const set=m=>{btns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.modo===m));document.getElementById('modo-planta').hidden=m!=='planta';document.getElementById('modo-3d').hidden=m!=='3d';document.body.classList.toggle('m3d',m==='3d');try{localStorage.setItem('arcos-modo',m);}catch(e){}};
btns.forEach(b=>b.addEventListener('click',()=>set(b.dataset.modo)));let m='planta';try{m=localStorage.getItem('arcos-modo')||'planta';}catch(e){}if(location.hash==='#3d'||/tour=/.test(location.hash+location.search))m='3d';set(m);
/* panel lateral del 3D: ancho arrastrable y ocultable */
const M3=document.getElementById('modo-3d'),G=document.getElementById('gutter'),T=document.getElementById('asideTg');
let w=215;try{w=+localStorage.getItem('arcos-aside-w')||215;if(localStorage.getItem('arcos-aside')==='off')M3.classList.add('noaside');}catch(e){}
const setW=v=>{w=Math.max(180,Math.min(520,v));M3.style.setProperty('--aside-w',w+'px');};setW(w);
const upd=()=>{if(!T.querySelector('svg'))T.textContent=M3.classList.contains('noaside')?'◂':'▸';};upd();
document.getElementById('toPlanta').addEventListener('click',()=>window.__setModo('planta'));
T.addEventListener('click',()=>{M3.classList.toggle('noaside');upd();try{localStorage.setItem('arcos-aside',M3.classList.contains('noaside')?'off':'on');}catch(e){}});
G.addEventListener('pointerdown',e=>{G.classList.add('on');G.setPointerCapture(e.pointerId);const x0=e.clientX,w0=w;const mv=ev=>setW(w0+(x0-ev.clientX));const up=()=>{G.classList.remove('on');G.removeEventListener('pointermove',mv);G.removeEventListener('pointerup',up);try{localStorage.setItem('arcos-aside-w',w);}catch(e){}};G.addEventListener('pointermove',mv);G.addEventListener('pointerup',up);});
})();
